name: PlatformIO Release

on:
  push:
    tags:
      - "v*"

# Keep release builds out of the shared self-hosted PlatformIO workspace while
# a branch/PR build is running.
concurrency:
  group: waveshare-firmware-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    env:
      PIP_ROOT_USER_ACTION: ignore
      VENV_PATH: /runner/data/venv/platformio
      PLATFORMIO_CORE_DIR: /runner/data/platformio
      PLATFORMIO_CORE_VERSION: 6.1.19

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          clean: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python virtual environment
        run: |
          mkdir -p "$(dirname "$VENV_PATH")"
          python3 -m venv "$VENV_PATH"
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"

      - name: Install PlatformIO
        run: python -m pip install "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Validate annotated release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the stable vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag $RELEASE_TAG must be an annotated tag (found $tag_type)" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "$RELEASE_TAG^{}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag $RELEASE_TAG does not point to the checked-out commit" >&2
            echo "tag:  $tag_commit" >&2
            echo "HEAD: $head_commit" >&2
            exit 1
          fi

      - name: Run native host tests
        run: python scripts/test_native_app_core.py

      - name: Build firmware
        run: pio run -d firmware -e waveshare-multi-mode

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          build_dir="firmware/.pio/build/waveshare-multi-mode"
          release_dir="release"
          mkdir -p "$release_dir"

          test -s "$build_dir/firmware.bin"
          test -s "$build_dir/firmware.factory.bin"
          test "$(stat -c%s "$build_dir/firmware.bin")" -le 6291456
          grep -aFq "waveshare-multi-mode-screen:manual-ota:v1" \
            "$build_dir/firmware.bin"

          ota_name="waveshare-multi-mode-${GITHUB_REF_NAME}-ota.bin"
          factory_name="waveshare-multi-mode-${GITHUB_REF_NAME}-factory.bin"
          cp "$build_dir/firmware.bin" "$release_dir/$ota_name"
          cp "$build_dir/firmware.factory.bin" "$release_dir/$factory_name"

          (
            cd "$release_dir"
            sha256sum "$ota_name" "$factory_name" > SHA256SUMS
          )

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.bin
            release/SHA256SUMS
