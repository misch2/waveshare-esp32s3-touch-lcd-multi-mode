name: PlatformIO Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# The self-hosted runner keeps a shared PlatformIO cache.  Serialize firmware
# jobs so two builds cannot modify the same package/cache or .pio outputs.
concurrency:
  group: waveshare-firmware-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    env:
      PIP_ROOT_USER_ACTION: ignore
      VENV_PATH: /runner/data/venv/platformio
      PLATFORMIO_CORE_DIR: /runner/data/platformio
      PLATFORMIO_CORE_VERSION: 6.1.19

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python virtual environment
        run: |
          mkdir -p "$(dirname "$VENV_PATH")"
          python3 -m venv "$VENV_PATH"
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"

      - name: Install PlatformIO
        run: python -m pip install "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Validate combined firmware
        run: python scripts/test_combined_firmware.py

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/.pio/build/waveshare-multi-mode/firmware.bin
            firmware/.pio/build/waveshare-multi-mode/firmware.factory.bin
